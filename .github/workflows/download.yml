name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Video via Cobalt API
        run: |
          # Cobalt APIに動画URLを送信してダウンロード直リンクを取得
          RESPONSE=$(curl -s -X POST "https://api.cobalt.tools/" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ inputs.video_url }}\", \"videoQuality\": \"max\"}")

          # レスポンスからダウンロードURLを抽出
          DOWNLOAD_URL=$(echo "$RESPONSE" | grep -oP '"url"\s*:\s*"\K[^"]+')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Failed to get download URL from API"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "Downloading video from: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o "downloaded_video.mp4"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloaded_video.mp4
          retention-days: 1
