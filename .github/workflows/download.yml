name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U yt-dlp

      - name: Save Cookie from Secrets
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Download Video via Python yt-dlp
        run: |
          python3 -c '
          import os, sys, yt_dlp

          url = "${{ inputs.video_url }}"
          
          # コピー用オプション（WebEmbedded経由でSABR/BOT制限を完全回避）
          ydl_opts = {
              "format": "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best",
              "outtmpl": "downloaded_video.mp4",
              "cookiefile": "cookies.txt",
              "extractor_args": {
                  "youtube": {
                      "player_client": ["web_embedded", "tv_embedded", "android_vr"],
                      "skip": ["hls", "dash"]
                  }
              },
              "merge_output_format": "mp4",
              "quiet": False,
          }

          try:
              with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                  print(f"Downloading: {url}")
                  ydl.download([url])
              print("Download completed successfully!")
          except Exception as e:
              print(f"Primary method failed: {e}")
              # フォールバック（Webベース最高画質）
              ydl_opts_fallback = {
                  "format": "b/bv*+ba",
                  "outtmpl": "downloaded_video.mp4",
                  "cookiefile": "cookies.txt",
                  "merge_output_format": "mp4",
              }
              with yt_dlp.YoutubeDL(ydl_opts_fallback) as ydl:
                  ydl.download([url])
          '

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloaded_video.mp4
          retention-days: 1
