name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U yt-dlp

      - name: Save Cookie from Secrets
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Download Video via Python yt-dlp
        run: |
          python3 -c '
          import yt_dlp

          url = "${{ inputs.video_url }}"

          ydl_opts = {
              "format": "best",
              "outtmpl": "downloaded_video.%(ext)s",
              "cookiefile": "cookies.txt",
              "extractor_args": {
                  "youtube": {
                      "player_client": ["android_vr", "web_embedded", "tv_embedded"]
                  }
              },
              "postprocessors": [{
                  "key": "FFmpegVideoConvertor",
                  "preferedformat": "mp4",
              }],
          }

          with yt_dlp.YoutubeDL(ydl_opts) as ydl:
              print(f"Downloading: {url}")
              ydl.download([url])
          '

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloaded_video.mp4
          retention-days: 1
