name: YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'ダウンロードしたいYouTubeのURLを入力'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cobalt APIで.mp4を取得してダウンロード
        run: |
          mkdir -p downloads
          
          python -c "
          import urllib.request
          import json
          import sys

          video_url = '${{ github.event.inputs.video_url }}'
          
          # 現在稼働中のCobalt APIインスタンス一覧
          api_instances = [
              'https://api.cobalt.tools',
              'https://cobalt.qtf.one',
              'https://co.wuk.sh'
          ]

          success = False

          for api_url in api_instances:
              endpoint = api_url if api_url.endswith('/') else api_url + '/'
              print(f'Trying API instance: {endpoint}')
              
              headers = {
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
              }
              
              # v10 APIで推奨されるパラメータ構成
              payload = json.dumps({
                  'url': video_url,
                  'videoQuality': '720',
                  'filenamePattern': 'basic'
              }).encode('utf-8')

              req = urllib.request.Request(endpoint, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      res = json.loads(response.read().decode('utf-8'))
                      
                      # レスポンスのstatusを確認
                      status = res.get('status')
                      print(f'Response status from {endpoint}: {status}')
                      
                      download_url = None
                      if status in ['tunnel', 'redirect']:
                          download_url = res.get('url')
                      elif status == 'picker':
                          # 複数ストリームがある場合は最初の動画を取得
                          picker = res.get('picker', [])
                          if picker and 'url' in picker[0]:
                              download_url = picker[0]['url']
                      
                      if download_url:
                          print('Found download URL:', download_url)
                          
                          # 動画ファイルのダウンロード
                          dl_req = urllib.request.Request(download_url, headers={'User-Agent': headers['User-Agent']})
                          with urllib.request.urlopen(dl_req, timeout=60) as dl_res, open('downloads/video.mp4', 'wb') as f:
                              f.write(dl_res.read())
                          
                          print('Download Completed!')
                          success = True
                          break
                      else:
                          print(f'No valid download URL in response: {res}')
              except Exception as e:
                  print(f'Failed on {endpoint}: {e}')

          if not success:
              print('All API instances failed.')
              sys.exit(1)
          "

      - name: ダウンロードした.mp4動画を保存（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
