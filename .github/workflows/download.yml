name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U yt-dlp

      - name: Save Cookie from Secrets
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Download Video via Python yt-dlp
        run: |
          python3 -c '
          import yt_dlp, sys

          url = "${{ inputs.video_url }}"

          # クラウドIP制限を回避するための段階的クライアントリスト
          client_configs = [
              ["tv"],
              ["tv_embedded", "web_embedded"],
              ["mweb", "web"],
              ["android"]
          ]

          success = False
          for clients in client_configs:
              print(f"=== Trying player_client: {clients} ===")
              ydl_opts = {
                  "cookiefile": "cookies.txt",
                  "format": "bv*+ba/b/best",
                  "outtmpl": "downloaded_video.%(ext)s",
                  "merge_output_format": "mp4",
                  "extractor_args": {
                      "youtube": {
                          "player_client": clients
                      }
                  },
                  "quiet": False,
              }
              try:
                  with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                      ydl.download([url])
                  success = True
                  print("Download completed successfully!")
                  break
              except Exception as e:
                  print(f"Attempt failed with {clients}: {e}")

          if not success:
              sys.exit(1)
          '

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloaded_video.mp4
          retention-days: 1
