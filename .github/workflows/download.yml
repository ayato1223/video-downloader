name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Deno (JavaScript Challenge Solver)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install dependencies & ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]"

      - name: Save Cookie from Secrets
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Download Video via Python yt-dlp
        run: |
          python3 -c '
          import yt_dlp, sys

          url = "${{ inputs.video_url }}"

          ydl_opts = {
              "cookiefile": "cookies.txt",
              "format": "bv*+ba/b/best",
              "outtmpl": "downloaded_video.%(ext)s",
              "merge_output_format": "mp4",
              "js_runtimes": ["deno"],
              "extractor_args": {
                  "youtube": {
                      "player_client": ["tv", "web_embedded", "mweb"]
                  }
              },
              "quiet": False,
          }

          try:
              with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                  print(f"Downloading: {url}")
                  ydl.download([url])
              print("Download completed successfully!")
          except Exception as e:
              print(f"Download error: {e}")
              sys.exit(1)
          '

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloaded_video.mp4
          retention-days: 1
