name: YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'ダウンロードしたいYouTubeのURLを入力'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cobalt APIで.mp4を取得してダウンロード
        run: |
          mkdir -p downloads
          
          python -c "
          import urllib.request
          import json
          import sys

          video_url = '${{ github.event.inputs.video_url }}'
          
          # 利用可能なCobalt APIのインスタンス一覧
          api_instances = [
              'https://api.cobalt.tools',
              'https://cobalt-api.kwippy.com',
              'https://cobalt.kwippy.com/api'
          ]

          success = False

          for api_url in api_instances:
              print(f'Trying API instance: {api_url}')
              
              headers = {
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
                  'Origin': 'https://cobalt.tools',
                  'Referer': 'https://cobalt.tools/'
              }
              
              payload = json.dumps({
                  'url': video_url,
                  'videoQuality': '720'
              }).encode('utf-8')

              req = urllib.request.Request(api_url, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      res = json.loads(response.read().decode('utf-8'))
                      download_url = res.get('url')
                      
                      if download_url:
                          print('Found download URL:', download_url)
                          
                          # 動画ファイルをストリーミングダウンロード
                          dl_req = urllib.request.Request(download_url, headers={'User-Agent': headers['User-Agent']})
                          with urllib.request.urlopen(dl_req) as dl_res, open('downloads/video.mp4', 'wb') as f:
                              f.write(dl_res.read())
                          
                          print('Download Completed!')
                          success = True
                          break
              except Exception as e:
                  print(f'Failed on {api_url}: {e}')

          if not success:
              print('All API instances failed.')
              sys.exit(1)
          "

      - name: ダウンロードした.mp4動画を保存（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
