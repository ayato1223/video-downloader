name: YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'ダウンロードしたいYouTubeのURLを入力'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 動画（.mp4）のダウンロード処理
        run: |
          mkdir -p downloads
          
          # Cobalt APIを使って直接.mp4を取得
          RESPONSE=$(curl -s -X POST "https://api.cobalt.tools/api/json" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ github.event.inputs.video_url }}\", \"videoQuality\": \"720\"}")
          
          # レスポンスからダウンロードURLを抽出
          DOWNLOAD_URL=$(echo $RESPONSE | jq -r '.url')
          
          if [ "$DOWNLOAD_URL" != "null" ] && [ -n "$DOWNLOAD_URL" ]; then
            echo "ダウンロードURLを取得しました: $DOWNLOAD_URL"
            curl -L -o "downloads/video.mp4" "$DOWNLOAD_URL"
          else
            echo "APIからの取得に失敗しました。"
            echo "API Response: $RESPONSE"
            exit 1
          fi

      - name: ダウンロードした.mp4動画を保存（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
