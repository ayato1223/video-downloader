name: YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'ダウンロードしたいYouTubeのURLを入力'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cobalt APIで.mp4を取得してダウンロード
        run: |
          mkdir -p downloads
          
          python -c "
          import urllib.request
          import json

          url = '${{ github.event.inputs.video_url }}'
          api_url = 'https://api.cobalt.tools/'
          
          headers = {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
          }
          data = json.dumps({
              'url': url,
              'videoQuality': '720'
          }).encode('utf-8')

          req = urllib.request.Request(api_url, data=data, headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req) as response:
                  res = json.loads(response.read().decode('utf-8'))
                  print('API Response:', res)
                  
                  download_url = res.get('url')
                  if download_url:
                      print('Downloading .mp4...')
                      urllib.request.urlretrieve(download_url, 'downloads/video.mp4')
                      print('Download Completed!')
                  else:
                      print('Failed to get download URL from response')
                      exit(1)
          except Exception as e:
              print('Error:', e)
              exit(1)
          "

      - name: ダウンロードした.mp4動画を保存（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
