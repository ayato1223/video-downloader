<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube動画ダウンローダー</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f9;
    }
    h1 { color: #333; }
    .input-box {
      margin-top: 20px;
    }
    input[type="text"] {
      width: 70%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #ff0000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #cc0000; }
  </style>
</head>
<body>
  <h1>YouTube MP4 ダウンローダー</h1>
  <p>変換したい動画のURLを入力してください</p>
  <div class="input-box">
    <input type="text" placeholder="https://www.youtube.com/watch?v=...">
    <button onclick="alert('画面の準備ができました！次はサーバー（バックエンド）を作成します。')">MP4変換</button>
  </div>
</body>
</html>
